version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - gosec
    - bodyclose
    - unconvert
    - unparam
    - prealloc
    - nakedret
    - errorlint
    - gocritic
    - copyloopvar

  settings:
    govet:
      enable-all: true
    gosec:
      excludes:
        - G115
    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - unparam
      - path: example/
        linters:
          - errcheck
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
